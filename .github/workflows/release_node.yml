# Builds, smoke-tests and publishes the fork's Node binding as @strangecyan/iroh, with one addon package per
# platform it ships. Runs on GitHub-hosted runners only: the upstream workflows need n0's self-hosted ones.
#
# Push a `node-v<version>` tag matching iroh-js/package.json to publish. Upstream's workflows fire on `v*` tags, so
# this one's tags never start that way. Pushes to the fork's branch, and runs by hand, do everything but publish.
#
# Publishing uses npm trusted publishing (OIDC) alone: no token is stored. npm can only trust a workflow for a package
# that exists, so a new package is first reserved with a placeholder by iroh-js/scripts/bootstrap-npm-trust.sh.

name: Release Node binding

on:
  push:
    branches:
      - relayed-connections
    tags:
      - 'node-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DEBUG: napi:*
  MACOSX_DEPLOYMENT_TARGET: '10.13'

jobs:
  version:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        name: Match the tag, the package and its platform packages
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./iroh-js/package.json').version")
          for manifest in iroh-js/npm/*/package.json; do
            platform_version=$(node -p "require('./$manifest').version")
            if [ "$platform_version" != "$version" ]; then
              echo "::error::$manifest is $platform_version, not $version: run \`yarn napi version\` in iroh-js"
              exit 1
            fi
          done
          publish=false
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME}" != "node-v${version}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match iroh-js/package.json version ${version}"
              exit 1
            fi
            publish=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.settings.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-15
            target: aarch64-apple-darwin
            build: yarn build --target aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: yarn build --target x86_64-pc-windows-msvc
          # napi-cross links against an old glibc sysroot, so the addon loads on older distributions than the
          # runner's.
          - host: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            build: yarn build --target x86_64-unknown-linux-gnu --use-napi-cross
          # Through zig against glibc 2.17, like the musl builds below. Upstream's system cross compiler links against
          # the runner's glibc, so the addon would not load before 2.33, and napi-cross's gcc cannot assemble ring.
          - host: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            setup: |
              pip3 install --break-system-packages ziglang
            build: |-
              set -e
              mkdir -p "$HOME/zigshim"
              printf '#!/bin/sh\nA=;for x in "$@";do case "$x" in --target=*|-Wl,--fix-cortex-a53-843419) ;; *) A="$A $x";; esac;done;exec python3 -m ziglang cc -target aarch64-linux-gnu.2.17 $A\n' > "$HOME/zigshim/zcc"
              printf '#!/bin/sh\nA=;for x in "$@";do case "$x" in --target=*) ;; *) A="$A $x";; esac;done;exec python3 -m ziglang c++ -target aarch64-linux-gnu.2.17 $A\n' > "$HOME/zigshim/zcxx"
              chmod +x "$HOME/zigshim/zcc" "$HOME/zigshim/zcxx"
              export CC_aarch64_unknown_linux_gnu="$HOME/zigshim/zcc"
              export CXX_aarch64_unknown_linux_gnu="$HOME/zigshim/zcxx"
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER="$HOME/zigshim/zcc"
              export TARGET_CC="$HOME/zigshim/zcc"
              export TARGET_CXX="$HOME/zigshim/zcxx"
              yarn build --target aarch64-unknown-linux-gnu
          # musl through zig, as upstream builds it. The shims drop the `--target` flags cc-rs adds, which zig
          # rejects, and on aarch64 a linker flag zig does not know.
          - host: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            setup: |
              pip3 install --break-system-packages ziglang
            build: |-
              set -e
              mkdir -p "$HOME/zigshim"
              printf '#!/bin/sh\nA=;for x in "$@";do case "$x" in --target=*) ;; *) A="$A $x";; esac;done;exec python3 -m ziglang cc -target x86_64-linux-musl $A\n' > "$HOME/zigshim/zcc"
              printf '#!/bin/sh\nA=;for x in "$@";do case "$x" in --target=*) ;; *) A="$A $x";; esac;done;exec python3 -m ziglang c++ -target x86_64-linux-musl $A\n' > "$HOME/zigshim/zcxx"
              chmod +x "$HOME/zigshim/zcc" "$HOME/zigshim/zcxx"
              export CC_x86_64_unknown_linux_musl="$HOME/zigshim/zcc"
              export CXX_x86_64_unknown_linux_musl="$HOME/zigshim/zcxx"
              export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER="$HOME/zigshim/zcc"
              export TARGET_CC="$HOME/zigshim/zcc"
              export TARGET_CXX="$HOME/zigshim/zcxx"
              yarn build --target x86_64-unknown-linux-musl
          - host: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            setup: |
              pip3 install --break-system-packages ziglang
            build: |-
              set -e
              mkdir -p "$HOME/zigshim"
              printf '#!/bin/sh\nA=;for x in "$@";do case "$x" in --target=*|-Wl,--fix-cortex-a53-843419) ;; *) A="$A $x";; esac;done;exec python3 -m ziglang cc -target aarch64-linux-musl $A\n' > "$HOME/zigshim/zcc"
              printf '#!/bin/sh\nA=;for x in "$@";do case "$x" in --target=*) ;; *) A="$A $x";; esac;done;exec python3 -m ziglang c++ -target aarch64-linux-musl $A\n' > "$HOME/zigshim/zcxx"
              chmod +x "$HOME/zigshim/zcc" "$HOME/zigshim/zcxx"
              export CC_aarch64_unknown_linux_musl="$HOME/zigshim/zcc"
              export CXX_aarch64_unknown_linux_musl="$HOME/zigshim/zcxx"
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER="$HOME/zigshim/zcc"
              export TARGET_CC="$HOME/zigshim/zcc"
              export TARGET_CXX="$HOME/zigshim/zcxx"
              yarn build --target aarch64-unknown-linux-musl
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        working-directory: ./iroh-js
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable corepack (yarn)
        run: npm install -g corepack --force && corepack enable
        shell: bash
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.settings.target }}
      - name: Set up the toolchain
        if: ${{ matrix.settings.setup }}
        run: ${{ matrix.settings.setup }}
        shell: bash
      - name: Install dependencies
        run: yarn install
        shell: bash
      - name: Build
        run: ${{ matrix.settings.build }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: iroh-js/iroh.*.node
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Smoke ${{ matrix.settings.platform }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            host: macos-15
          - platform: win32-x64-msvc
            target: x86_64-pc-windows-msvc
            host: windows-latest
          # In containers older or other than the runner, so a glibc or musl mismatch fails here, not in production.
          - platform: linux-x64-gnu
            target: x86_64-unknown-linux-gnu
            host: ubuntu-24.04
            image: node:24-bullseye-slim
          - platform: linux-arm64-gnu
            target: aarch64-unknown-linux-gnu
            host: ubuntu-24.04-arm
            image: node:24-bullseye-slim
          - platform: linux-x64-musl
            target: x86_64-unknown-linux-musl
            host: ubuntu-24.04
            image: node:24-alpine
          - platform: linux-arm64-musl
            target: aarch64-unknown-linux-musl
            host: ubuntu-24.04-arm
            image: node:24-alpine
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: iroh-js/npm/${{ matrix.settings.platform }}
      - name: Pack the package and this platform's addon
        shell: bash
        run: |
          set -euo pipefail
          smoke="${RUNNER_TEMP}/smoke"
          mkdir -p "$smoke"
          (cd iroh-js && npm pack --silent --pack-destination "$smoke")
          (cd "iroh-js/npm/${{ matrix.settings.platform }}" && npm pack --silent --pack-destination "$smoke")
          cp .github/scripts/smoke-node.mjs "$smoke/"
          echo '{"name":"smoke","private":true,"type":"module"}' > "$smoke/package.json"
          ls -la "$smoke"
      # Only the tarballs are installed: the loader must find the addon in its platform package.
      - name: Smoke test
        if: ${{ !matrix.settings.image }}
        shell: bash
        working-directory: ${{ runner.temp }}/smoke
        run: |
          npm install --no-audit --no-fund ./*.tgz
          node smoke-node.mjs
      - name: Smoke test in ${{ matrix.settings.image }}
        if: ${{ matrix.settings.image }}
        shell: bash
        run: >-
          docker run --rm -v "${RUNNER_TEMP}/smoke:/smoke" -w /smoke ${{ matrix.settings.image }}
          sh -c 'npm install --no-audit --no-fund ./*.tgz && node smoke-node.mjs'

  publish:
    name: Publish to npm
    needs: [version, smoke]
    if: ${{ needs.version.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      # npm trusted publishing exchanges the workflow's OIDC token; only this job may request one.
      id-token: write
    defaults:
      run:
        working-directory: ./iroh-js
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.19.0
      - uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: iroh-js/artifacts
      - name: Place each addon in its platform package
        shell: bash
        run: |
          set -euo pipefail
          for dir in npm/*/; do
            platform=$(basename "$dir")
            addon=$(find artifacts -name "iroh.${platform}.node" -print -quit)
            if [ -z "$addon" ]; then
              echo "::error::No addon was built for ${platform}"
              exit 1
            fi
            cp "$addon" "$dir"
          done
          ls -la npm/*/
      # Added here rather than kept in the repository: until the platform packages exist on npm, an install would
      # fail to resolve them.
      - name: Depend on the platform packages
        run: |
          # shellcheck disable=SC2016 # the template literal is JavaScript's, not the shell's
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
            manifest.optionalDependencies = Object.fromEntries(
              fs.readdirSync("npm").sort().map(platform => [`${manifest.name}-${platform}`, manifest.version])
            );
            fs.writeFileSync("package.json", JSON.stringify(manifest, null, 2) + "\n");
            console.log(manifest.optionalDependencies);
          '
      # Platform packages first, so the package that depends on them never resolves to a missing one. A retry after
      # a partial release skips what is already published.
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          publish() {
            local dir=$1
            local name version
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "${name}@${version}" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
              echo "${name}@${version} is already published; skipping"
              return
            fi
            (cd "$dir" && npm publish --access public --provenance --ignore-scripts --tag latest --registry https://registry.npmjs.org)
          }
          for dir in npm/*; do publish "$dir"; done
          publish .
